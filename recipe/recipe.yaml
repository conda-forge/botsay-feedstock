schema_version: 1

context:
  version: "1.4.4"

package:
  name: botsay
  version: ${{ version }}

source:
  url: https://github.com/xyproto/botsay/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f3d726d7b3609f40e7244eca29efe2e6f0feb5a0d4f472681984df376637c3d7

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - botsay --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - license-files/
  summary: Output text together with randomly generated ASCII robots in colors inspired by synthwave/rainbows
  homepage: https://github.com/xyproto/botsay
  repository: https://github.com/xyproto/botsay

extra:
  recipe-maintainers:
    - danielnachun
